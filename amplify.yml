version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next 16 needs Node >= 20.9; the Amplify image ships nvm
        - nvm install 20 && nvm use 20
        - node --version
        # pnpm is not on the image's PATH — enable it via corepack (version pinned in package.json)
        - corepack enable
        - corepack prepare pnpm@10.7.0 --activate
        - pnpm --version
        - pnpm install --frozen-lockfile || pnpm install
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
